# RegLens — liste du corpus
# Mettre ce fichier dans data/sources.yaml.
# mode: auto      -> téléchargé par scripts/download_corpus.py
# mode: generated -> créé par scripts/generate_synthetic.py (aucun téléchargement)
# Les fichiers téléchargés vont dans data/raw/<type>/<id>.<format> (dossier ignoré par git).

regulations:   # Lois européennes — source unique : EUR-Lex (base officielle du droit de l'UE)
  - id: dora
    title: "DORA — Règlement (UE) 2022/2554 sur la résilience opérationnelle numérique"
    short_name: "DORA"
    what: "Règles de sécurité informatique pour le secteur financier : gestion des risques IT, déclaration des incidents, tests, prestataires IT."
    format: html
    mode: auto
    urls:
      en: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32022R2554
      fr: https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32022R2554

  - id: dora_rts_incident_classification
    title: "Règlement délégué (UE) 2024/1772 — classification des incidents"
    short_name: "RTS 2024/1772"
    what: "Complète DORA : critères et seuils pour décider si un incident informatique est « majeur »."
