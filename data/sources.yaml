policies:   # Documents internes d'une fintech fictive — générés, jamais téléchargés
  - id: synthetic_policies
    what: "62 politiques internes en Markdown, 8 thèmes (incidents IT, violations de données, anti-blanchiment, sous-traitance IT, conservation crypto, gouvernance IA, sécurité des paiements, protection des fonds), avec fausses PII (noms, e-mails, IBAN) et une fausse clé API chacune."
    format: md
    mode: generated

logs:   # Journal des incidents IT de la fintech fictive — généré
  - id: synthetic_incident_logs
    what: "~50 000 lignes JSON (JSONL, un événement par ligne) pour ~200 incidents (incident_id, timestamp, severity, system, owning_unit, status, detected_at, reported_at). Certains incidents sont volontairement déclarés en retard."
    format: jsonl
    mode: generated

register_of_information:   # Registre d'informations des prestataires TIC de la fintech fictive — généré
  - id: synthetic_register
    what: "Registre d'informations DORA (colonnes inspirées des modèles de l'ITS 2024/2956) : un prestataire TIC par ligne, lié aux systèmes et unités, avec une personne de contact fictive."
    format: csv
    mode: generated
