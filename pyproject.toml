[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reglens"
version = "0.1.0"
description = "Retrieval-augmented question answering on EU regulations for mid-size fintechs, with exact citations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Dependencies are added phase by phase, only when a phase needs them.
# Versions are pinned (==) so every machine and CI run uses exactly the same code.
dependencies = [
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    # Phase 1 — corpus
    "httpx==0.28.1",            # HTTP client (streaming downloads; reused later for API calls)
    "pyyaml==6.0.3",            # reads data/sources.yaml
    "faker==40.54.0",           # fake names, e-mails, IBANs for the synthetic corpus
    # Phase 2 — parsing & PII
    "docling==2.151.0",         # PDF parsing: layout, reading order, tables (pulls in PyTorch, CPU)
    "presidio-analyzer==2.2.366",   # finds PII spans (spaCy NER + regex recognizers)
    "presidio-anonymizer==2.2.366", # replaces the spans with placeholders
    "lxml==6.1.3",              # EUR-Lex XHTML parsing
    "psycopg[binary]==3.3.9",   # PostgreSQL driver (table values)
    "pypdfium2==5.15.2",        # PDF text layer + page rendering, to check Docling's tables
    # Phase 3 — chunking
    "transformers==5.23.0",     # bge-m3 tokenizer (chunk sizes) and sentence vectors (semantic cuts)
    "spacy==3.8.18",            # sentence boundaries (same md models as Presidio; was indirect)
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261113",  # type information for pyyaml (used by mypy)
]
# spaCy NER models for Presidio (decision O5: md size). They are not on PyPI:
# spaCy publishes them as wheel files on GitHub, one version per spaCy minor (3.8).
# Install with:  pip install -e ".[dev,models]"   (CI installs only ".[dev]")
models = [
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "fr_core_news_md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------- ruff (linter + formatter) ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import order, B = bugbear, UP = modern syntax, N = naming
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Prose templates: re-wrapping French/English sentences to 100 columns hurts readability.
"src/reglens/corpus/policy_templates.py" = ["E501"]
# Inline XHTML fixture copying the real EUR-Lex markup line by line.
"tests/test_parse_eurlex.py" = ["E501"]

# ---------- mypy (static type checker) ----------
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "scripts", "tests"]
plugins = ["pydantic.mypy"]

# Libraries without type information (per-library exceptions; the global rules stay strict).
[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "presidio_anonymizer.*", "lxml.*", "pypdfium2.*"]
ignore_missing_imports = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs heavy local models (spaCy md, Docling) or the real corpus; skipped when they are missing and deselected in CI",
]
