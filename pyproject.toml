[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reglens"
version = "0.1.0"
description = "RAG assistant for EU regulatory compliance in mid-size fintechs, with exact citations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Dependencies are added phase by phase, only when a phase needs them.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Phase 1 — corpus
    "httpx>=0.27",      # HTTP client (streaming downloads; reused later for API calls)
    "pyyaml>=6.0",      # reads data/sources.yaml
    "faker>=26.0",      # fake names, e-mails, IBANs for the synthetic corpus
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",     # type information for pyyaml (used by mypy)
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------- ruff (linter + formatter) ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import order, B = bugbear, UP = modern syntax, N = naming
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Prose templates: re-wrapping French/English sentences to 100 columns hurts readability.
"src/reglens/corpus/policy_templates.py" = ["E501"]

# ---------- mypy (static type checker) ----------
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "scripts", "tests"]
plugins = ["pydantic.mypy"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
