name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Docling needs PyTorch. On Linux, PyPI's default build bundles CUDA (several GB);
      # CI has no GPU, so install the CPU build first, at the versions pinned locally.
      - name: Install PyTorch (CPU build)
        run: pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu

      # No spaCy/Docling models in CI: tests that need them are marked `integration`.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (types)
        run: mypy

      - name: Pytest (unit tests only)
        run: pytest -m "not integration"
